name: yoyo-test

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: "no"
    environment:
      POSTGRES_USER: yoyo
      POSTGRES_PASSWORD: yoyo
      POSTGRES_DB: yoyo_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yoyo -d yoyo_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: "no"
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: "no"
    command: server /data --console-address ":9003"
    environment:
      MINIO_ROOT_USER: yoyo
      MINIO_ROOT_PASSWORD: yoyo12345
    ports:
      - "9002:9000"
      - "9003:9003"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
