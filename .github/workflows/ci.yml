name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  NODE_ENV: test

jobs:
  lint-typecheck-unit-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @yoyo/database db:generate

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Unit tests
        run: pnpm turbo run test

      - name: Build
        run: pnpm turbo run build

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Plain postgres:16-alpine has no `vector` extension, and the
        # phase3_ai_sales migration runs `CREATE EXTENSION vector` -
        # migrate deploy fails here every time (pre-existing, unrelated to
        # this change - confirmed via `gh run list`, CI has never passed
        # on this repo). Same image docker-compose.staging.yml already uses.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: yoyo
          POSTGRES_PASSWORD: yoyo
          POSTGRES_DB: yoyo_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U yoyo -d yoyo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://yoyo:yoyo@localhost:5433/yoyo_test
      REDIS_URL: redis://localhost:6380
      S3_ENDPOINT: http://localhost:9002
      S3_REGION: us-east-1
      S3_BUCKET: yoyo-test
      S3_ACCESS_KEY_ID: yoyo
      S3_SECRET_ACCESS_KEY: yoyo12345
      S3_FORCE_PATH_STYLE: "true"
    steps:
      - uses: actions/checkout@v4

      # Not a `services:` entry - GitHub Actions service containers can't
      # override the image's command (unlike docker-compose's `command:`),
      # and quay.io/minio/aistor/minio (the current public MinIO image, since
      # both the legacy quay.io/minio/minio and bitnami/minio free images
      # were locked down/removed on 2026-09-24/25) requires an explicit
      # `server /data` command - it doesn't default to server mode like
      # bitnami's wrapper did. Plain `docker run` + health-poll instead.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9002:9000 \
            -e MINIO_ROOT_USER=yoyo -e MINIO_ROOT_PASSWORD=yoyo12345 \
            quay.io/minio/aistor/minio:latest server /data
          for i in $(seq 1 20); do
            curl -sf http://localhost:9002/minio/health/live && break
            sleep 2
          done

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @yoyo/database db:generate

      - name: Apply migrations
        run: pnpm --filter @yoyo/database db:migrate:deploy

      # apps/api's e2e specs import compiled workspace packages (@yoyo/testing,
      # @yoyo/crypto, @yoyo/ai, @yoyo/worker-ai, @yoyo/worker-social-sync, etc.)
      # by their package.json main/types, which point at dist/ - ts-jest can't
      # resolve any of them without this. Missing here made every single suite
      # fail with TS2307 "Cannot find module", unrelated to any one branch.
      - name: Build workspace packages
        run: pnpm turbo run build

      - name: Integration tests (includes tenant-isolation suite)
        run: pnpm --filter @yoyo/api test:integration
